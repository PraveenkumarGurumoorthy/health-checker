services:
  web:
    image: praveenkumargurumoorthy/health-checker:latest
    ports:
      - "${FLASK_PORT}:5000"
    env_file:
      - .env
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  cache:
    image: redis:alpine
    volumes:
      - health-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  health-data: